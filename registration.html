<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }
    fieldset {
      border: 1px solid #999;
      padding: 20px;
    }
    input, select {
      width: 100%;
      padding: 7px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      margin-right: 5px;
    }
    .error { color: red; }
    .invalid { border: 2px solid red; }
  </style>
</head>
<body>
  <h1>Patient Registration Form</h1>

  <form id="registrationForm" novalidate>
    <fieldset>
      <legend>Patient Details</legend>

      <p><label for="patientName">Patient Name:</label><br>
      <input type="text" id="patientName" name="patientName"><br>
      <span class="error" id="patientNameError"></span></p>

      <p><label for="mobile">Mobile Number:</label><br>
      <input type="tel" id="mobile" name="mobile"><br>
      <span class="error" id="mobileError"></span></p>

      <p><label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br>
      <span class="error" id="emailError"></span></p>

      <p><label for="dateOfBirth">Date of Birth:</label><br>
      <input type="date" id="dateOfBirth" name="dateOfBirth"><br>
      <span class="error" id="dateOfBirthError"></span></p>

      <p><label for="gender">Gender:</label><br>
      <select id="gender" name="gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select><br>
      <span class="error" id="genderError"></span></p>

      <p><label for="address">Address:</label><br>
      <input type="text" id="address" name="address"><br>
      <span class="error" id="addressError"></span></p>

      <p><label for="bloodGroup">Blood Group:</label><br>
      <select id="bloodGroup" name="bloodGroup">
        <option value="">Select blood group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select><br>
      <span class="error" id="bloodGroupError"></span></p>

      <p><label for="department">Department/Appointment Type:</label><br>
      <select id="department" name="department">
        <option value="">Select department</option>
        <option value="General Medicine">General Medicine</option>
        <option value="Cardiology">Cardiology</option>
        <option value="Dermatology">Dermatology</option>
        <option value="Orthopedics">Orthopedics</option>
      </select><br>
      <span class="error" id="departmentError"></span></p>

      <p><label for="registrationDate">Registration Date:</label><br>
      <input type="date" id="registrationDate" name="registrationDate"><br>
      <span class="error" id="registrationDateError"></span></p>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </fieldset>
  </form>

  <script src="registration.js"></script>
</body>
</html>
