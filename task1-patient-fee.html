<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration Fee</title>
  <link rel="stylesheet" href="experiment5.css">
</head>
<body>
  <h1>Patient Registration Fee</h1>
  <form id="feeForm">
    <fieldset>
      <legend>Patient Details</legend>
      <label for="patientName">Patient Name</label>
      <input type="text" id="patientName" name="patientName" required>
      <label for="patientId">Patient ID</label>
      <input type="text" id="patientId" name="patientId" required>
      <label for="age">Patient Age</label>
      <input type="number" id="age" name="age" min="0" required>
      <label for="consultationFee">Consultation Fee</label>
      <input type="number" id="consultationFee" name="consultationFee" min="0" required>
      <label for="registrationFee">Registration Fee</label>
      <input type="number" id="registrationFee" name="registrationFee" min="0" required>
      <button type="submit">Calculate</button>
    </fieldset>
  </form>
  <p id="error" class="error"></p>
  <div id="result"></div>
  <script src="task1-patient-fee.js"></script>
</body>
</html>
