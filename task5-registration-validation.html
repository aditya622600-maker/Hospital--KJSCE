<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration Validation</title>
  <link rel="stylesheet" href="experiment5.css">
</head>
<body>
  <h1>Patient Registration Validation</h1>
  <form id="registrationForm" novalidate>
    <fieldset>
      <legend>Registration Details</legend>
      <label for="patientName">Patient Name</label>
      <input type="text" id="patientName" name="patientName">
      <span id="patientNameError" class="error"></span>
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile">
      <span id="mobileError" class="error"></span>
      <label for="patientId">Patient ID</label>
      <input type="text" id="patientId" name="patientId" placeholder="PAT-1234">
      <span id="patientIdError" class="error"></span>
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <span id="emailError" class="error"></span>
      <button type="submit">Register</button>
    </fieldset>
  </form>
  <p id="successMessage" class="success"></p>
  <script src="task5-registration-validation.js"></script>
</body>
</html>
